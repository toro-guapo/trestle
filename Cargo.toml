[package]
name = "trestle"
version = "1.4.1"
edition = "2024"
license = "Apache-2.0"

[workspace]
members = ["trestle-net"]
default-members = [".", "trestle-net"]

[features]
default = [
  "lang-astro",
  "lang-blade",
  "lang-config",
  "lang-csharp",
  "lang-dart",
  "lang-dockerfile",
  "lang-ejs",
  "lang-erb",
  "lang-go",
  "lang-groovy",
  "lang-hcl",
  "lang-html",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-kotlin",
  "lang-liquid",
  "lang-php",
  "lang-plist",
  "lang-powershell",
  "lang-python",
  "lang-razor",
  "lang-redis",
  "lang-ruby",
  "lang-rust",
  "lang-shell",
  "lang-sql",
  "lang-svelte",
  "lang-swift",
  "lang-toml",
  "lang-twig",
  "lang-vue",
  "lang-xml",
  "lang-yaml",
  "schema-aws-codebuild",
  "schema-azure-pipelines",
  "schema-bitbucket-pipelines",
  "schema-buildkite",
  "schema-circleci",
  "schema-docker-compose",
  "schema-drone",
  "schema-jupyter",
  "schema-github-actions",
  "schema-gitlab-ci",
  "schema-k8s-secret",
  "schema-mcp-config",
  "schema-package-json",
  "schema-travis-ci",
  "schema-vscode-tasks",
  "binary",
  "pem",
  "putty",
  "rails-master-key",
  "services",
  "signatures",
  "url",
  "lsp",
  "mcp",
  "entropy-key",
  "entropy-token",
  "git-history",
]
cache = ["dep:rusqlite", "dep:xxhash-rust"]
entropy-key = []
entropy-token = []
git-history = ["dep:chrono"]
mcp = ["dep:rmcp", "dep:serde", "dep:tokio"]
validation = []
lang-astro = ["lang-javascript", "dep:tree-sitter", "dep:tree-sitter-astro-next"]
lang-blade = ["lang-php"]
lang-config = []
lang-csharp = ["dep:tree-sitter", "dep:tree-sitter-c-sharp"]
lsp = ["dep:crossbeam-channel", "dep:lsp-server", "dep:lsp-types", "dep:libc", "dep:windows-sys"]
lang-dart = ["dep:tree-sitter", "dep:tree-sitter-dart"]
lang-dockerfile = ["dep:dockerfile-parser"]
lang-ejs = ["lang-html", "lang-javascript"]
lang-erb = ["lang-html", "lang-ruby"]
lang-go = ["dep:tree-sitter", "dep:tree-sitter-go"]
lang-groovy = ["dep:tree-sitter", "dep:tree-sitter-groovy"]
lang-hcl = ["dep:hcl-edit"]
lang-html = ["lang-javascript", "dep:tree-sitter", "dep:tree-sitter-html"]
lang-java = ["dep:tree-sitter", "dep:tree-sitter-java"]
lang-javascript = [
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_parser",
  "dep:oxc_span",
  "dep:oxc_syntax",
]
lang-json = ["dep:jsonc-parser"]
lang-kotlin = ["dep:tree-sitter", "dep:tree-sitter-kotlin-ng"]
lang-liquid = ["lang-html"]
lang-php = [
  "lang-html",
  "dep:mago-ast",
  "dep:mago-interner",
  "dep:mago-parser",
  "dep:mago-source",
  "dep:mago-span",
]
lang-plist = ["dep:plist", "dep:roxmltree"]
lang-powershell = ["dep:tree-sitter", "dep:tree-sitter-powershell"]
lang-python = [
  "dep:ruff_python_ast",
  "dep:ruff_python_parser",
  "dep:ruff_text_size",
]
lang-razor = ["lang-csharp", "lang-html"]
lang-redis = []
lang-ruby = ["dep:ruby-prism"]
lang-rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]
lang-shell = ["dep:brush-parser"]
lang-sql = []
lang-svelte = ["lang-javascript", "dep:tree-sitter", "dep:tree-sitter-svelte-ng"]
lang-swift = ["dep:tree-sitter", "dep:tree-sitter-swift"]
lang-toml = []
lang-twig = ["lang-html"]
lang-vue = ["lang-javascript", "dep:tree-sitter", "dep:tree-sitter-vue-next"]
lang-xml = ["dep:roxmltree"]
lang-yaml = ["dep:yaml-rust2"]

binary = ["binary-der", "binary-gpg", "binary-jceks", "binary-jks", "binary-keepass"]
binary-der = ["dep:cms", "dep:der", "dep:pkcs1", "dep:pkcs8", "dep:pkcs12", "dep:x509-cert"]
