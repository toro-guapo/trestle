[dependencies]
aho-corasick = "1.1.4"
base64 = "0.22.1"
bip39 = "2.2.2"
blake3 = "1"
brush-parser = { version = "0.3.0", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
cms = { version = "0.2", default-features = false, optional = true }
croner = "3.0.1"
crossbeam-channel = { version = "0.5", optional = true }
csv = "1.4"
csscolorparser = "0.8"
der = { version = "0.7", default-features = false, features = ["alloc"], optional = true }
dirs = "6.0"
dockerfile-parser = { version = "0.9", optional = true }
email_address = "0.2"
fastrand = "2"
form_urlencoded = { version = "1", optional = true }
glob-match = "0.2"
gix = "0.81"
heck = "0.5"
icu_locale_core = "2.2"
icu_time = { version = "2.2", default-features = false, features = ["compiled_data"] }
in_definite = "1.1"
ixdtf = "0.6"
hcl-edit = { version = "0.9", optional = true }
jsonc-parser = { version = "0.32.3", optional = true }
mago-ast = { version = "0.22.2", optional = true }
mago-interner = { version = "0.22.2", optional = true }
mago-parser = { version = "0.22.2", optional = true }
mago-source = { version = "0.22.2", optional = true }
mago-span = { version = "0.22.2", optional = true }
mime = "0.3"
mimalloc = { version = "*", features = ["v3"] }
notify = "8"
oxc_allocator = { version = "0.124", optional = true }
percent-encoding = { version = "2", optional = true }
pgp = { version = "0.19", default-features = false, optional = true }
oxc_ast = { version = "0.124", optional = true }
oxc_parser = { version = "0.124", optional = true }
oxc_span = { version = "0.124", optional = true }
oxc_syntax = { version = "0.124", optional = true }
pkcs1 = { version = "0.7", default-features = false, features = ["alloc"], optional = true }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
pkcs12 = { version = "0.1", default-features = false, optional = true }
plist = { version = "1.8.0", default-features = false, optional = true }
quick-xml = "0.39"
rayon = "1.11.0"
regex = "1.12.3"
roxmltree = { version = "0.21", optional = true }
ruby-prism = { version = "1.9", optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
serde_json = "1"
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.94.1", optional = true }
rmcp = { version = "1.6", features = ["transport-io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.10", optional = true }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.10", optional = true }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.10", optional = true }
terminal_size = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
toml_edit = "0.22"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-astro-next = { version = "0.1.1", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-dart = { version = "0.1.0", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-groovy = { version = "0.1", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-svelte-ng = { version = "1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-vue-next = { version = "0.1", optional = true }
url = { version = "2", optional = true }
x509-cert = { version = "0.2", default-features = false, features = ["std"], optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
yaml-rust2 = { version = "0.11.0", optional = true }
shell-quote = "0.7.2"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.profiling]
inherits = "release"
strip = false
debug = 2
